name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run catalog
      - run: npm run packages:check
      - run: npm run measure
      - run: npm run docs:build
      - run: npm run docs:check
      - run: npm run pack:check
      - run: npm run pack:verify

  # Computed styles, style injection and axe can only be checked in a real
  # browser, so this runs on every push and pull request as well.
  verify-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - name: Verify the advertised options still match the render
        run: npm run audit:customization
      - name: Layout cost per frame
        run: npm run audit:layout
