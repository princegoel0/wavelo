name: Release packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      release_enabled: ${{ steps.gate.outputs.enabled }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run docs:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run audit:customization
      - run: npm run audit:visual:correctness
      - run: npm run pack:check
      - name: Check release gate
        id: gate
        shell: bash
        env:
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
        run: |
          if [[ "$RELEASE_ENABLED" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release gate is disabled; validation completed without publishing."
          fi
      - name: Verify package versions changed consistently
        if: steps.gate.outputs.enabled == 'true'
        id: version
        run: |
          node scripts/validate-release.mjs
          node -e "const fs=require('node:fs'); const v=JSON.parse(fs.readFileSync('packages/core/package.json','utf8')).version; fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version='+v+'\\n')"
      - name: Build release tarballs
        if: steps.gate.outputs.enabled == 'true'
        # npm does not create the destination directory: without this the pack
        # step fails with ENOENT on the first package.
        run: mkdir -p release-tarballs && npm pack --workspaces --pack-destination release-tarballs
      - name: Upload validated release tarballs
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wavelo-${{ steps.version.outputs.version }}-tarballs
          path: release-tarballs/*.tgz

  publish:
    name: Publish npm packages
    needs: validate
    if: needs.validate.outputs.release_enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          token: ${{ secrets.NPM_TOKEN }}
      - name: Download validated release tarballs
        uses: actions/download-artifact@v4
        with:
          name: wavelo-${{ needs.validate.outputs.version }}-tarballs
          path: release-tarballs
      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail
          # Provenance requires npm trusted publishing, which is configured per
          # existing package, so the first release publishes with a granular
          # token and `--provenance` returns once trusted publishing is set up
          # for each @wavelo package.
          for package in \
            wavelo-core \
            wavelo-vanilla \
            wavelo-web-components \
            wavelo-react \
            wavelo-vue \
            wavelo-svelte \
            wavelo-angular
          do
            npm publish "release-tarballs/${package}-${{ needs.validate.outputs.version }}.tgz" --access public
          done
