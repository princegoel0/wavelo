name: Release packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      release_enabled: ${{ steps.gate.outputs.enabled }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run docs:build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: npm run test:browser:firefox
      - run: npm run test:browser:webkit
      - run: npm run audit:customization
      - run: npm run audit:layout
      - run: npm run audit:visual:correctness
      - run: npm run packages:check
      - run: npm run pack:check
      - run: npm run pack:verify
      - name: Check release gate
        id: gate
        shell: bash
        env:
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
        run: |
          if [[ "$RELEASE_ENABLED" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release gate is disabled; validation completed without publishing."
          fi
      - name: Verify package versions changed consistently
        if: steps.gate.outputs.enabled == 'true'
        id: version
        run: |
          node scripts/validate-release.mjs
          node -e "const fs=require('node:fs'); const v=JSON.parse(fs.readFileSync('packages/core/package.json','utf8')).version; fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version='+v+'\\n')"
      - name: Build release tarballs
        if: steps.gate.outputs.enabled == 'true'
        # npm does not create the destination directory: without this the pack
        # step fails with ENOENT on the first package.
        run: mkdir -p release-tarballs && npm pack --workspaces --pack-destination release-tarballs
      - name: Upload validated release tarballs
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wavelo-${{ steps.version.outputs.version }}-tarballs
          path: release-tarballs/*.tgz

  publish:
    name: Publish npm packages
    needs: validate
    if: needs.validate.outputs.release_enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
    # npm reads its registry credential from NODE_AUTH_TOKEN, which setup-node writes into
    # the generated .npmrc as a reference to that variable. The action's `token` input is a
    # different thing entirely - it authenticates the Node.js download - so passing the
    # registry credential there left npm referencing a value that was never the one intended.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download validated release tarballs
        uses: actions/download-artifact@v4
        with:
          name: wavelo-${{ needs.validate.outputs.version }}-tarballs
          path: release-tarballs
      - name: Check registry authentication
        env:
          MAPPED_DIRECTLY: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # The publish loop fails with a bare 404 when the registry does not accept the
          # scope, which cannot tell a missing organization from a token that never got
          # sent. Ask the registry who it thinks we are first, and print the generated
          # config with the credential elided, so the answer is in the log rather than
          # guessed at. This step publishes nothing: if it fails, nothing was attempted.
          echo "userconfig: ${NPM_CONFIG_USERCONFIG:-unset}"
          if [[ -f "${NPM_CONFIG_USERCONFIG:-/nonexistent}" ]]; then
            sed 's/:_authToken=.*/:_authToken=<redacted>/' "$NPM_CONFIG_USERCONFIG"
          fi
          echo "registry: $(npm config get registry)"
          # The registry refuses a credential it never received, so print the shape of what
          # npm will actually send - length and whether it carries the `npm_` prefix a
          # granular token starts with - and whether it is the same string the repository
          # setting holds. Never the value: a length and a yes/no cannot be replayed.
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "credential: NODE_AUTH_TOKEN is unset in this step"
          else
            echo "credential: set, ${#NODE_AUTH_TOKEN} characters, npm_ prefix: $(
              [[ "${NODE_AUTH_TOKEN:0:4}" == "npm_" ]] && echo yes || echo no
            )"
          fi
          echo "repository setting: ${#MAPPED_DIRECTLY} characters, npm_ prefix: $(
            [[ "${MAPPED_DIRECTLY:0:4}" == "npm_" ]] && echo yes || echo no
          )"
          echo "npm is sending the repository setting: $(
            [[ "$MAPPED_DIRECTLY" == "${NODE_AUTH_TOKEN:-}" ]] && echo yes || echo no
          )"
          if whoami=$(npm whoami 2>&1); then
            echo "authenticated as ${whoami}"
          else
            echo "not authenticated: ${whoami}"
            exit 1
          fi
      - name: Publish packages
        shell: bash
        env:
          # Trusted publishing is configured on npm per package, by the owner. Until
          # every @wavelo package has a publisher for this repository, workflow and
          # environment, `--provenance` would fail the publish, so the flag is a
          # repository variable and the granular token remains the default.
          RELEASE_PROVENANCE: ${{ vars.RELEASE_PROVENANCE }}
        run: |
          set -euo pipefail
          provenance=()
          if [[ "$RELEASE_PROVENANCE" == "true" ]]; then provenance=(--provenance); fi
          packages=(
            wavelo-core
            wavelo-vanilla
            wavelo-web-components
            wavelo-react
            wavelo-vue
            wavelo-svelte
            wavelo-angular
          )
          version="${{ needs.validate.outputs.version }}"
          # The `./` is not decoration. npm reads `dir/name.tgz` as the GitHub shorthand
          # `user/repo` and runs `git ls-remote` on it, which is how the first attempt at
          # 0.1.0 failed with "Permission denied (publickey)" before reaching the registry.
          # Resolve and check every tarball before publishing any of them, so a bad path
          # cannot leave a partial release behind: these seven versions are permanent.
          for package in "${packages[@]}"; do
            tarball="./release-tarballs/${package}-${version}.tgz"
            test -f "$tarball" || { echo "missing $tarball"; exit 1; }
            npm publish --dry-run --access public "$tarball" > /dev/null
          done
          for package in "${packages[@]}"; do
            npm publish --access public "./release-tarballs/${package}-${version}.tgz" ${provenance[@]+"${provenance[@]}"}
          done
