name: Gallery

# The documentation gallery is one self-contained HTML file built from the registry, so
# publishing it is a build and an upload. It deploys from `main`, from a manual run, or
# after the `Release packages` workflow completes — and only once the owner has pointed
# Pages at "GitHub Actions" in the repository settings and set the repository variable
# GALLERY_ENABLED to `true`. Until then every job skips, so pushing this file cannot fail
# a run on `main` or publish anything by accident. The `workflow_run` path additionally
# requires the run that triggered it to have succeeded: a release that failed validation
# must not deploy a site on top of it.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Release packages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gallery
  cancel-in-progress: false

jobs:
  build:
    if: vars.GALLERY_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run docs:build
      - run: npm run docs:verify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    if: vars.GALLERY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
